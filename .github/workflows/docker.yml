name: Build and Push Portfolio Docker Images


on:

  push:

    tags:

      - "v*.*.*"



permissions:

  contents: read

  packages: write



jobs:


  docker:


    runs-on: ubuntu-latest



    steps:


      -
        name: Checkout

        uses: actions/checkout@v4



      -
        name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      -
        name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3



      -
        name: Build and Push Frontend

        uses: docker/build-push-action@v6

        with:

          context: .

          file: docker/frontend.Dockerfile

          push: true

          tags: |

            ghcr.io/andgelbrissaud/andgel-portfolio:latest

            ghcr.io/andgelbrissaud/andgel-portfolio:${{ github.ref_name }}

          build-args: |

            VITE_API_URL=/api





      -
        name: Build and Push Backend

        uses: docker/build-push-action@v6

        with:

          context: .

          file: docker/backend.Dockerfile

          push: true

          tags: |

            ghcr.io/andgelbrissaud/andgel-portfolio-backend:latest

            ghcr.io/andgelbrissaud/andgel-portfolio-backend:${{ github.ref_name }}